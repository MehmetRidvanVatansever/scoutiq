{% extends "base.html" %}
{% block content %}
<h4>Oyuncuyu Düzenle <small class="text-muted">#{{ p.player_id }}</small></h4>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Ad</label>
      <input name="name" class="form-control" value="{{ p.name }}" required></div>
    <div class="col-md-6"><label class="form-label">Doğum tarihi</label>
      <input name="dob" type="date" class="form-control" value="{{ p.date_of_birth or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Ülke</label>
      <select name="country_id" class="form-select"><option value="">-</option>
        {% for c in countries %}<option value="{{ c.country_id }}" {{ 'selected' if c.country_id == p.country_id }}>{{ c.name }}</option>{% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label">Pozisyon</label>
      <select name="position_id" class="form-select" required>
        {% for s in positions %}<option value="{{ s.position_id }}" {{ 'selected' if s.position_id == p.position_id }}>{{ s.label }}</option>{% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label">Kulüp</label>
      <select name="club_id" class="form-select"><option value="">Kulüpsüz</option>
        {% for c in clubs %}<option value="{{ c.club_id }}" {{ 'selected' if c.club_id == p.club_id }}>{{ c.name }}</option>{% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label">Ayak</label>
      <select name="foot" class="form-select"><option value="">-</option>
        {% for f in ['right', 'left', 'both'] %}<option {{ 'selected' if f == p.foot }}>{{ f }}</option>{% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label">Boy (cm)</label>
      <input name="height" type="number" min="1" class="form-control" value="{{ p.height_cm or '' }}"></div>
    <div class="col-md-4"><label class="form-label">Piyasa değeri (M€)</label>
      <input name="value" type="number" step="any" min="0" class="form-control"
             value="{{ ('%g' % (p.market_value_eur / 1000000)) if p.market_value_eur is not none else '' }}"></div>
  </div>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-dark">Kaydet</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin') }}">İptal</a>
  </div>
</form>
{% endblock %}
