{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <div class="card card-body">
    <h4 class="mb-3">Giriş Yap</h4>
    <form method="post">
      <input name="username" class="form-control mb-2" placeholder="Kullanıcı adı" required>
      <input name="password" type="password" class="form-control mb-3" placeholder="Şifre" required>
      <button class="btn btn-dark w-100">Giriş</button>
    </form>
    <a class="mt-3" href="{{ url_for('register') }}">Hesabın yok mu? Kayıt ol</a>
  </div>
</div></div>
{% endblock %}
