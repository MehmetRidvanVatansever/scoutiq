{# Yalnızca admin'e görünen değer güncelleme / düzenleme / silme #}
{% if session.role == 'admin' %}
<div class="card card-body mb-3 border-danger">
  <h6>Admin</h6>
  <div class="d-flex gap-3 flex-wrap">
    <form method="post" action="{{ url_for('admin.admin_player_value', pid=p.player_id) }}" class="d-flex gap-2">
      <input name="value" type="number" step="any" min="0" class="form-control form-control-sm" placeholder="New value (M€)" required>
      <button class="btn btn-sm btn-dark">Update value</button></form>
    <a class="btn btn-sm btn-outline-dark" href="{{ url_for('admin.admin_player_edit', pid=p.player_id) }}">Edit all details</a>
    <form method="post" action="{{ url_for('admin.admin_player_delete', pid=p.player_id) }}"
          data-confirm="{{ p.name }} will be deleted. This cannot be undone. Continue?">
      <button class="btn btn-sm btn-danger">Delete player</button></form>
  </div>
</div>
{% endif %}
