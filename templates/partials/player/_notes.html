{# Kullanıcının bu oyuncu için aldığı notlar: ekleme, düzenleme, silme #}
<div class="card card-body mb-3">
  <h5>My Notes</h5>
  <form method="post" action="{{ url_for('reports.add_note', pid=p.player_id) }}" class="d-flex gap-2">
    <input name="note" class="form-control" placeholder="Short note" required>
    <button class="btn btn-dark btn-sm">Add</button>
  </form>
  <hr>
  {% for n in notes %}
    <div class="mb-2 border-bottom pb-2">
      <div class="d-flex justify-content-between align-items-start">
        <div>{{ n.note }} <small class="text-muted">· {{ n.created_at.strftime('%d.%m.%Y') }}</small></div>
        <form method="post" action="{{ url_for('reports.delete_note', nid=n.note_id) }}" data-confirm="Delete this note?">
          <button class="btn btn-link btn-sm text-danger p-0">Delete</button></form>
      </div>
      <details class="mt-1"><summary class="small text-muted">Edit</summary>
        <form method="post" action="{{ url_for('reports.edit_note', nid=n.note_id) }}" class="d-flex gap-2 mt-2">
          <input type="hidden" name="next" value="{{ request.path }}">
          <input name="note" class="form-control form-control-sm" value="{{ n.note }}" required>
          <button class="btn btn-dark btn-sm">Save</button>
        </form>
      </details>
    </div>
  {% else %}<small class="text-muted">You haven't added a note yet.</small>{% endfor %}
</div>
