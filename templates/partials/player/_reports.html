{# Kullanıcının bu oyuncu için yazdığı raporlar: ekleme, düzenleme, silme #}
<div class="card card-body mb-3">
  <h5>Scout Report</h5>
  <form method="post" action="{{ url_for('reports.add_report', pid=p.player_id) }}">
    <input name="rating" type="number" min="1" max="10" class="form-control mb-2" placeholder="Rating (1-10)" required>
    <textarea name="text" class="form-control mb-2" rows="3" placeholder="Report text" required></textarea>
    <button class="btn btn-dark btn-sm">Save report</button>
  </form>
  <hr>
  {% for r in reports %}
    <div class="mb-2 border-bottom pb-2">
      <div class="d-flex justify-content-between align-items-start">
        <div><b>{{ r.rating }}/10</b> · <small class="text-muted">{{ r.created_at.strftime('%d.%m.%Y %H:%M') }}</small></div>
        <form method="post" action="{{ url_for('reports.delete_report', rid=r.report_id) }}" data-confirm="Delete this report?">
          <button class="btn btn-link btn-sm text-danger p-0">Delete</button></form>
      </div>
      <div style="white-space: pre-line">{{ r.report_text }}</div>
      <details class="mt-1"><summary class="small text-muted">Edit</summary>
        <form method="post" action="{{ url_for('reports.edit_report', rid=r.report_id) }}" class="mt-2">
          <input type="hidden" name="next" value="{{ request.path }}">
          <input name="rating" type="number" min="1" max="10" class="form-control form-control-sm mb-2" value="{{ r.rating }}" required>
          <textarea name="text" class="form-control form-control-sm mb-2" rows="3" required>{{ r.report_text }}</textarea>
          <button class="btn btn-dark btn-sm">Save</button>
        </form>
      </details>
    </div>
  {% else %}<small class="text-muted">You haven't written a report yet.</small>{% endfor %}
</div>
