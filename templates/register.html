{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
  <div class="card card-body">
    <h4 class="mb-3">Kayıt Ol</h4>
    <form method="post">
      <input name="username" class="form-control mb-2" placeholder="Kullanıcı adı" required>
      <input name="email" type="email" class="form-control mb-2" placeholder="E-posta" required>
      <input name="password" type="password" class="form-control mb-3" placeholder="Şifre (en az 6)" required>
      <button class="btn btn-dark w-100">Kayıt Ol</button>
    </form>
    <a class="mt-3" href="{{ url_for('login') }}">Zaten hesabın var mı? Giriş yap</a>
  </div>
</div></div>
{% endblock %}
